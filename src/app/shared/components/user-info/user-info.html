<div class="user-info">
  <div nz-button nz-dropdown class="user-details" [nzDropdownMenu]="menu">
    <strong>{{ userName() || 'User' }}</strong>
    <span>{{ userRole() || 'No role available' }}</span>
  </div>
  <nz-dropdown-menu #menu="nzDropdownMenu">
    <ul nz-menu nzSelectable>
      <li nz-menu-item><nz-icon nzType="user" /><span>User Info</span></li>
      <li nz-menu-item><nz-icon nzType="lock" /><span>Change Password</span></li>
      <li nz-menu-item (click)="logOut()" (keypress)="logOut()"><nz-icon nzType="logout" /><span>Sign Out</span></li>
    </ul>
  </nz-dropdown-menu>
</div>
