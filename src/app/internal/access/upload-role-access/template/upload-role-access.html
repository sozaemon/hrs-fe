<nz-card nzTitle="Upload Role Access" class="grid-row">
  <div class="flex flex-row justify-between">
    <div class="grid-row">
      <h2 class="text-lg font-semibold">Role Access Upload</h2>
      <p class="text-sm">Download the template, fill it in, and upload it to register role access mappings.</p>
    </div>
    <div class="flex flex-row gap-2">
      <button nz-button [nzLoading]="isDownloading()" (click)="downloadTemplate()">
        Download Template
      </button>
      <button nz-button nzType="primary"  (click)="displayUploadFormToggle()">
        Upload Template
      </button>
    </div>
  </div>

  <data-table
    [data]="uploadedData()"
    [columnDefinition]="uploadedRoleAccessColumns"
    [totalRecords]="totalSize()"
    [page]="page()"
    [pageSize]="pageSize()"
    [loading]="isLoading()"
    [showPagination]="true"
    [allowRowSelect]="true"
    [actions]="resolveColumnAction()"
    (queryChange)="handleQueryChange($event)"
    (doAction)="resolveRowAction($event)">
  </data-table>
  <nz-modal
    [nzVisible]="displayUploadForm()"
    nzTitle="Upload Role Access"
    nzWidth="min(92vw, 640px)"
    (nzVisibleChange)="resetUploadForm()"
    (nzOnCancel)="closeUploadForm()"
    (nzOnOk)="doUploadFile()">
    <ng-container *nzModalContent>
      <div class="flex flex-col gap-2">
        <div class="flex flex-col gap-2">
          <label for="fileInput" class="text-sm">Description</label>
          <input nz-input id="fileInput" #fileInput [(ngModel)]="description"/>
        </div>
        <nz-upload
          [nzBeforeUpload]="beforeUpload"
          [nzShowUploadList]="true"
          [nzAccept]="acceptedFileTypes"
          [nzFileList]="fileList()"
          [nzDisabled]="isUploading()">
          <button nz-button nzType="primary" [nzLoading]="isUploading()" [disabled]="fileList.length > 0">
            Upload Template
          </button>
        </nz-upload>
      </div>
    </ng-container>
  </nz-modal>
</nz-card>
