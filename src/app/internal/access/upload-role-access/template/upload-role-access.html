<nz-card nzTitle="Upload Role Access" class="grid-row">
  <div class="flex flex-row justify-between">
    <div class="grid-row">
      <h2 class="text-lg font-semibold">Role Access Upload</h2>
      <p class="text-sm">Download the template, fill it in, and upload it to register role access mappings.</p>
    </div>
    <div class="flex flex-row gap-2">
      <button nz-button [nzLoading]="isDownloading()" (click)="downloadTemplate()">
        Download Template
      </button>
      <nz-upload
        [nzBeforeUpload]="beforeUpload"
        [nzShowUploadList]="false"
        [nzAccept]="acceptedFileTypes"
        [nzDisabled]="isUploading()">
        <button nz-button nzType="primary" [nzLoading]="isUploading()">
          Upload Template
        </button>
      </nz-upload>
    </div>
  </div>

  <data-table
    [data]="uploadedData()"
    [columnDefinition]="uploadedRoleAccessColumns"
    [totalRecords]="totalSize()"
    [page]="page()"
    [pageSize]="pageSize()"
    [loading]="isLoading()"
    [showPagination]="true"
    [allowRowSelect]="false"
    (queryChange)="handleQueryChange($event)">
  </data-table>
</nz-card>
