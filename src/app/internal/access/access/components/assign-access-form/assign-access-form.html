<nz-modal [(nzVisible)]="formVisible" 
  (nzOnCancel)="closeForm()"
  (nzOnOk)="resolveOkFunction()"
  nzWidth="min(92vw, 640px)"
  nzTitle="Assign Access to Role"
>
  <ng-container *nzModalContent>
    <div>
      <dynamic-form-builder 
        [config]="formConfig()"
        [submitLabel]="'Assign Access'"
        (submitted)="createRoleAccess($any($event))"
        [showActions]=false
      />
    </div>
  </ng-container>
</nz-modal>
