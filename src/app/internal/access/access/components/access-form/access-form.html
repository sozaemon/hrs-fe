<nz-modal [(nzVisible)]="displayAccessForm"
  (nzOnCancel)="closeForm()"
  (nzOnOk)="resolveOkFunction()"
  nzWidth="min(92vw, 640px)"
  nzTitle="Access Form"
>
  <ng-container *nzModalContent>
    <div class="form-container">
      <dynamic-form-builder 
      [config]="formConfig()"
      [submitLabel]="resolveSubmitLabel()"
      (submitted)="onSubmit($any($event))"
      [showActions]=false
      />
      <div>
        @if(isLoading()){
          <span>Load role data</span>
        }@else {
           <nz-checkbox-group
            [nzDisabled]="mode() === 'read'"
            [nzOptions]="roleOptions()"
            [(ngModel)]="assignedRole" 
            />
        }
       
      </div>
    </div>
  </ng-container>
</nz-modal>
