<nz-modal [(nzVisible)]="displayRoleForm"
(nzOnCancel)="closeForm()"
(nzOnOk)="resolveOkFunction()"
 nzWidth="min(92vw, 640px)"
 nzTitle="Role Form"
>
  <ng-container *nzModalContent>
    <div class="form-container">
      <dynamic-form-builder
        [config]="formConfig()"
        (submitted)="onSubmit($any($event))"
        [showActions]="false"/>
    </div>
  </ng-container>
</nz-modal>
