<nz-modal [(nzVisible)]="displayRoleForm"
(nzOnCancel)="closeForm()"
(nzOnOk)="resolveOkFunction()"
 nzWidth="min(92vw, 640px)"
 nzTitle="Role Form"
>
  <ng-container *nzModalContent>
    <div class="form-container">
      <dynamic-form-builder
        [config]="formConfig()"
        (submitted)="onSubmit($any($event))"
        [showActions]="false"/>
    </div>
  </ng-container>
  <div *nzModalFooter >
    <button nz-button [nzType]="'default'" (click)="closeForm()">{{mode() === "view" ? "Close" : "Cancel"}}</button>
    @if(mode() !== "view"){
      <button nz-button [nzType]="'primary'" [nzLoading]="isLoading()" 
      (click)="resolveOkFunction()">{{mode() === "create" ? "Create" : "Update"}}</button>
    }
  </div>
</nz-modal>
