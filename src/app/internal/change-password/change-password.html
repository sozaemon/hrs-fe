<div class="flex items-center justify-center h-screen">
  <nz-card [nzBordered]="false" class="grid  gap-2 p-4 bg-gray-50 rounded-lg border border-gray-200 w-md h-md">
    <span  class="font-bold mb-10">Change Password Form</span>
    <form [formGroup]="changePasswordForm" nz-form nzLayout="vertical"
      (ngSubmit)="updatePassword()">
      <nz-form-item>
        <nz-form-label nzFor="oldPassword">Old Password</nz-form-label>
          <nz-form-control nzErrorTip="Please Enter Old Password">
            <nz-input-password>
              <input nz-input id="oldPassword" name="oldPassword" type="password" 
              aria-label="oldPassword"/>
            </nz-input-password>
          </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="oldPassword">New Password</nz-form-label>
          <nz-form-control nzErrorTip="Please Enter Old Password">
            <nz-input-password>
              <input nz-input id="newPassword" name="newPassword" type="password" 
              aria-label="newPassword"/>
            </nz-input-password>
          </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="oldPassword">Repeat Password</nz-form-label>
          <nz-form-control nzErrorTip="Please Enter Old Password">
            <nz-input-password>
              <input nz-input id="repeatPassword" name="repeatPassword" type="password" 
              aria-label="repeatPassword"/>
            </nz-input-password>
          </nz-form-control>
      </nz-form-item>
      <button nz-button nzType="primary" type="submit" nzBlock>Update Password</button>
    </form>
    <div class="grid grid-row mt-2">
      <small class="align-center">On update password completed, user will be redirected to Login Screen</small>
      <button nz-button (click)="backToHome()">Return to Home</button>
    </div>
  </nz-card>
</div>
