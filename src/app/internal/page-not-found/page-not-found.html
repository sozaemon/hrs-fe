<main class="not-found-shell">
  <section class="not-found-panel" aria-labelledby="page-title">
    <div class="brand-lockup" aria-label="HRS">
      <span class="brand-mark">H</span>
      <strong>HRS</strong>
    </div>

    <div class="not-found-copy">
      <p class="eyebrow">Error 404</p>
      <p class="display-number" aria-hidden="true">404</p>
      <h1 id="page-title">This page took an unexpected day off.</h1>
      <p class="description">
        The address may be out of date, or the page may have moved. Let&apos;s get you back to your workspace.
      </p>
      <button nz-button nzType="primary" nzSize="large" (click)="returnToHome()">
        <span nz-icon nzType="home" nzTheme="outline"></span>
        Return to home
      </button>
    </div>

    <p class="support-note">Need a hand? Contact your workspace administrator.</p>
  </section>

  <aside class="not-found-art" aria-hidden="true">
    <div class="orbit orbit-one"></div>
    <div class="orbit orbit-two"></div>
    <div class="calendar-shape">
      <span class="calendar-ring ring-left"></span>
      <span class="calendar-ring ring-right"></span>
      <span class="calendar-line"></span>
      <span class="calendar-date">04<br>04</span>
    </div>
    <span class="art-label">OFFICE / 04</span>
  </aside>
</main>
