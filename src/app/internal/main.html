<nz-layout class="app-layout">
  <nz-sider nzCollapsible [nzTrigger]="null" [nzCollapsed]="isCollapsed()" nzWidth="200px" class="nav-sider">
    <div class="brand" [class.brand-collapsed]="isCollapsed()">
      <span>
        {{ isCollapsed() ? "H" : "HRS Workspace"}}
      </span>
    </div>
    <nav-panel [isCollapse]="isCollapsed()" />
  </nz-sider>
  <nz-layout>
    <nz-header class="app-header">
      <div class="header-left">
        <button nz-button nzType="primary" (click)="toggleCollapsed()">
          <nz-icon [nzType]="isCollapsed() ? 'menu-unfold' : 'menu-fold'" />
        </button>
        <page-search />
      </div>
      <div class="header-actions">
        <button nz-button nzType="text" class="notification-button" aria-label="Notifications">
          <nz-icon nzType="bell" />
          <span class="notification-dot"></span>
        </button>
        <div class="user-summary">
          <user-info />
        </div>
      </div>
    </nz-header>
    <nz-content class="app-content">
      <router-outlet />
    </nz-content>
  </nz-layout>
</nz-layout>

<ng-template #viewAll><a href="#">View all <nz-icon nzType="arrow-right" /></a></ng-template>
