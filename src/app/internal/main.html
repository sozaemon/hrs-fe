<nz-layout class="app-layout">
  <nz-sider nzCollapsible [nzTrigger]="null" [nzCollapsed]="isCollapsed()" nzWidth="200px" class="app-sidebar">
    <div class="brand" [class.brand-collapsed]="isCollapsed()">
      <span>
        @if(isCollapsed()){
           <img nz-image nzSrc="/favicon.ico" alt="icon" width="25px" height="25px"/> 
        }@else {
          HRS Workspace
        }
        <!-- {{ isCollapsed() ? "H" : "HRS Workspace"}} -->
      </span>
    </div>
    <nav-panel [isCollapse]="isCollapsed()" />
  </nz-sider>
  <nz-layout>
    <nz-header class="app-header">
      <div class="header-left">
        <button nz-button nzType="primary" (click)="toggleCollapsed()">
          <nz-icon [nzType]="isCollapsed() ? 'menu-unfold' : 'menu-fold'" />
        </button>
        <page-search />
      </div>
      <div class="header-actions">
        <button nz-button nzType="text" class="notification-button" aria-label="Notifications">
          <nz-icon nzType="bell" />
        </button>
        <div class="user-summary">
          <user-info />
        </div>
      </div>
    </nz-header>
    <nz-content class="app-content">
      <nz-tabs
        nzType="editable-card"
        nzHideAdd
        [nzSelectedIndex]="selectedTabIndex()"
        (nzSelectedIndexChange)="selectTab($event)"
        (nzClose)="disposeTab($event)">
        @for(tab of tabs(); track tab.key){
          <nz-tab [nzClosable]="tab.key !== homeTabKey" [nzTitle]="tab.name">
            <ng-container *ngComponentOutlet="tab.component!"></ng-container>
          </nz-tab>
        }
       </nz-tabs>
    </nz-content>
  </nz-layout>
</nz-layout>

<ng-template #viewAll><a href="#">View all <nz-icon nzType="arrow-right" /></a></ng-template>
